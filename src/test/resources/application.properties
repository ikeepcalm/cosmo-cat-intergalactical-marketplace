# Testcontainers Configuration
# Database connection is configured dynamically via AbstractIntegrationTest
# Tests that extend AbstractIntegrationTest will use PostgreSQL in Docker
# Tests that don't extend it can exclude database autoconfiguration below

# For non-database tests, uncomment these exclusions:
# spring.autoconfigure.exclude=\
#   org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
#   org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
#   org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

# Liquibase will be enabled by AbstractIntegrationTest for integration tests
spring.liquibase.enabled=false

# Show SQL for debugging in tests
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Disable security auto-configuration in tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration